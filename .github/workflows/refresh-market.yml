# Rebuild data/market.json from public retail pages and sold comps.
# Sold comps come from TCGplayer sales history, BrickLink, HWPriceGuide, and Swappa.
# Asks are not stored as solds. This does not publish the site. publish.yml still only runs npm test.
name: refresh-market

on:
  schedule:
    - cron: "30 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-market
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh market data
        run: node scripts/refresh-market.mjs
      - name: Test before commit
        run: npm test
      - name: Commit market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/market.json
          if git diff --cached --quiet; then
            echo "No market changes"
          else
            git commit -m "Refresh multi-brand market data"
            git push
          fi
