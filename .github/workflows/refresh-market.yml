# Rebuild data/market.json from public retail pages and sold comps.
# Sold comps come from TCGplayer sales history, BrickLink, HWPriceGuide, and Swappa.
# Asks are not stored as solds. This does not publish the site. publish.yml still only runs npm test.
name: refresh-market

on:
  schedule:
    # Daily refresh, 13:30 UTC.
    - cron: "30 13 * * *"
    # 10:00 America/Chicago. 15:00 UTC is CDT, 16:00 UTC is CST.
    - cron: "0 15 * * *"
    - cron: "0 16 * * *"
    # 13:00 America/Chicago. 18:00 UTC is CDT, 19:00 UTC is CST.
    - cron: "0 18 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-market
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh market data
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: node scripts/refresh-market.mjs
      - name: Append the dated comps to the price history
        run: node scripts/build-market-history.mjs
      - name: Test before commit
        run: npm test
      - name: Commit market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/market.json data/market-history.json
          if git diff --cached --quiet; then
            echo "No market changes"
          else
            git commit -m "Refresh multi-brand market data"
            git push
          fi
