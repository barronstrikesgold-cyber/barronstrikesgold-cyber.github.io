# Static phone page is the source of truth.
# Do not rebuild reseller-hunt / Next.js over this Pages repo.
name: publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [publish]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: echo "GitHub Pages serves the static files in this repo. Next.js publish is disabled."
