# rebuild: finds-buy-list-books-form-fix-2026-09-09
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [publish]

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: site
      - uses: actions/checkout@v4
        with:
          repository: barronstrikesgold-cyber/reseller-hunt
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install && npm run build
        working-directory: app
      - name: Publish static site to this user Pages repo
        run: |
          rsync -a --delete --exclude .git --exclude .github app/out/ site/
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No site changes"
          else
            git commit -m "Publish Reseller Finds rename"
            git push
          fi
