# Re-check official promo pages every 6 hours.
# Live code strings are not committed. Offers keep a source URL, expiry, and last-checked time.
# Affiliate network feeds run only when the COUPON_FEED_URL secret is set.
name: refresh-coupons

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-coupons
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh coupon offers
        env:
          COUPON_FEED_URL: ${{ secrets.COUPON_FEED_URL }}
        run: node scripts/refresh-coupons.mjs
      - name: Test before commit
        run: npm test
      - name: Commit coupon offers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/coupons.json
          if git diff --cached --quiet; then
            echo "No coupon changes"
          else
            git commit -m "Refresh owner coupon offers"
            git push
          fi
