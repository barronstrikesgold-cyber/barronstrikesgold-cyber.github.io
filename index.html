<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070708" />
    <meta name="description" content="Hunt: find it, check the profit after fees, track it, get alerted." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hunt" />
    <title>Hunt</title>
    <script>
      try {
        var huntTheme = localStorage.getItem("hunt-theme") || "system";
        if (huntTheme === "light" || huntTheme === "dark") document.documentElement.setAttribute("data-theme", huntTheme);
      } catch (err) {}
    </script>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="lib/dates.js"></script>
    <script defer src="lib/resale-cards.js"></script>
    <script defer src="lib/rules.js"></script>
    <script defer src="lib/hunt-drops.js"></script>
    <script defer src="lib/flow.js"></script>
    <script defer src="lib/amazon.js"></script>
    <script defer src="lib/market.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <a class="skip" href="#screen" data-skip>Skip to content</a>
    <div class="app">
      <header class="topbar" id="topbar">
        <button type="button" class="header-back" id="header-back" data-action="history-back" hidden>
          <span aria-hidden="true">‹</span> Back
        </button>
        <a class="brand" id="brand-home" href="#/home">
          <img class="mark" src="assets/brand/mark.svg" alt="" width="32" height="32" />
          <span class="brand-copy">
            <h1 class="wordmark">Hunt</h1>
            <p class="status-line">
              <span class="status-live" id="status-live" role="status"></span>
              <span class="checked" id="checked-line"></span>
            </p>
          </span>
        </a>
        <p class="view-title" id="view-title" hidden></p>
        <label class="global-search">
          <span class="sr-only">Search</span>
          <input id="global-q" type="search" enterkeyhint="search" autocomplete="off" placeholder="Search deals and brands" />
        </label>
        <div class="top-actions">
          <button type="button" class="icon-btn" id="refresh-btn" data-action="refresh" aria-label="Refresh prices">
            <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          </button>
        </div>
      </header>
      <div id="update-banner" class="update-banner" hidden>
        <p>Update available</p>
        <button type="button" id="apply-update">Update</button>
      </div>
      <main id="screen" class="screen" tabindex="-1">
        <h1>What did you find?</h1>
        <div class="skeleton-list" aria-busy="true" aria-label="Loading your hunt">
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
        </div>
      </main>
      <footer class="site-footer">
        <p>© 2026 Broken Beaker Labs LC</p>
        <p>As an Amazon Associate I earn from qualifying purchases.</p>
        <p>This product uses TCGplayer data but is not endorsed or certified by TCGplayer.</p>
        <p><a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a></p>
      </footer>
      <nav class="tabbar" aria-label="Primary" role="tablist">
        <button type="button" role="tab" id="tab-home" data-tab="home" aria-selected="true" aria-current="page" aria-controls="screen" class="is-on">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11l8-7 8 7V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z" stroke-linejoin="round"/></svg>
          <span>Home</span>
        </button>
        <button type="button" role="tab" id="tab-calendar" data-tab="calendar" aria-selected="false" aria-controls="screen">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>
          <span>Drops &amp; Calendar</span>
        </button>
        <button type="button" role="tab" id="tab-catalog" data-tab="catalog" aria-selected="false" aria-controls="screen">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg>
          <span>Catalog</span>
        </button>
        <button type="button" role="tab" id="tab-scan" data-tab="scan" aria-selected="false" aria-controls="screen">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7V4h3M20 7V4h-3M4 17v3h3M20 17v3h-3M7 12h10"/></svg>
          <span>Scan</span>
        </button>
        <button type="button" role="tab" id="tab-stuff" data-tab="stuff" aria-selected="false" aria-controls="screen">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 4h12v16l-6-3-6 3z" stroke-linejoin="round"/></svg>
          <span>My Stuff</span>
        </button>
      </nav>
    </div>
    <dialog id="sheet" class="sheet" aria-label="Sheet"></dialog>
    <dialog id="zoom" class="lightbox" aria-label="Full photo">
      <button type="button" class="lightbox-close" data-action="close-zoom">Close</button>
      <div id="zoom-frame"></div>
    </dialog>
    <noscript>Hunt needs JavaScript for the hunt, inventory, and profit math.</noscript>
  </body>
</html>
