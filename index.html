<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070708" />
    <meta name="description" content="Reseller. Buy gold-flame STH, CC/F&amp;F Spectraflame chase, and Matchbox SUPER CHASE at peg price." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Reseller" />
    <title>Reseller</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip" href="#screen">Skip to content</a>
    <div class="app">
      <header class="topbar">
        <img class="mark" src="assets/brand/mark.svg" alt="" width="44" height="44" />
        <div class="brand-copy">
          <p class="wordmark">Reseller</p>
          <p class="tagline">Buy gold-flame STH, CC/F&amp;F Spectraflame chase, and Matchbox SUPER CHASE at peg price; leave everything else unless Selective and last sold clears fees.</p>
          <p class="checked" id="checked-line"></p>
          <p class="status-live" id="status-live" role="status"></p>
        </div>
        <div class="top-actions">
          <button type="button" class="icon-btn" id="refresh-btn" data-action="refresh">Refresh</button>
        </div>
      </header>
      <main id="screen" class="screen" tabindex="-1">
        <div class="state-card">
          <img src="assets/states/scene-loading.svg" alt="" />
          <strong>Loading</strong>
          <p>Opening your hunt.</p>
        </div>
      </main>
      <nav class="tabbar" aria-label="Primary" role="tablist">
        <button type="button" role="tab" id="tab-hunt" data-tab="hunt" aria-selected="true" aria-controls="screen" class="is-on">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3c.4 3 3 4.2 3 7.2 0 1.2-.6 2-.2 3.2 1.6-.8 2.6-2.4 2.2-4.2-.6 2.6-2.4 4-2.2 6.6 0 1.6-1.2 2.8-2.8 2.8s-2.8-1.2-2.8-2.8c.2-2.6-1.6-4-2.2-6.6-.4 1.8.6 3.4 2.2 4.2.4-1.2-.2-2-.2-3.2C9 7.2 11.6 6 12 3z"/><path d="M7 16.5h7" stroke-linecap="round"/></svg>
          <span>Hunt</span>
        </button>
        <button type="button" role="tab" id="tab-stores" data-tab="stores" aria-selected="false" aria-controls="screen">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10h16v9H4zM3 10l2-5h14l2 5M9 19v-5h6v5" stroke-linejoin="round"/></svg>
          <span>Stores</span>
        </button>
        <button type="button" role="tab" id="tab-drops" data-tab="drops" aria-selected="false" aria-controls="screen">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 9h16M8 3v4M16 3v4" stroke-linecap="round"/></svg>
          <span>Drops</span>
        </button>
        <button type="button" role="tab" id="tab-inventory" data-tab="inventory" aria-selected="false" aria-controls="screen">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h16v11H4zM8 8V6h8v2" stroke-linejoin="round"/></svg>
          <span>Inventory</span>
        </button>
        <button type="button" role="tab" id="tab-profit" data-tab="profit" aria-selected="false" aria-controls="screen">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 18V6M4 18h16" stroke-linecap="round"/><path d="M8 14l3-4 3 2 4-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Profit</span>
        </button>
      </nav>
    </div>
    <dialog id="sheet" class="sheet" aria-label="Sheet"></dialog>
    <dialog id="zoom" class="lightbox" aria-label="Full photo">
      <button type="button" class="lightbox-close" data-action="close-zoom">Close</button>
      <img id="zoom-img" alt="" />
    </dialog>
    <script src="cash.js"></script>
    <script src="lib/dates.js"></script>
    <script src="lib/prices.js"></script>
    <script src="lib/search.js"></script>
    <script src="lib/providers.js"></script>
    <script src="lib/inventory.js"></script>
    <script src="lib/rules.js"></script>
    <script src="app.js"></script>
    <noscript>Reseller needs JavaScript for the hunt, inventory, and profit math.</noscript>
  </body>
</html>
